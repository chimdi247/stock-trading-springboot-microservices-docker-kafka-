global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: docker-compose

scrape_configs:

  # ── Application telemetry (OTel metrics, relayed by the collector) ──
  - job_name: otel-apps
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # ── Containers + host ──
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── Data tier ──
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: proxysql                 # built-in exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["proxysql:6070"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka-exporter           # consumer lag, topics, partitions
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka-jmx                # broker JMX (java agent)
    static_configs:
      - targets: ["kafka:7071"]

  # ── Observability stack itself ──
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # ── Black-box HTTP probes: availability / uptime / external latency ──
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api-gateway:8080/actuator/health"]
        labels: { service: api-gateway }
      - targets: ["http://user-service:8081/actuator/health"]
        labels: { service: user-service }
      - targets: ["http://market-data-service:8082/actuator/health"]
        labels: { service: market-data-service }
      - targets: ["http://order-service:8083/actuator/health"]
        labels: { service: order-service }
      - targets: ["http://portfolio-service:8084/actuator/health"]
        labels: { service: portfolio-service }
      - targets: ["http://notification-service:8085/actuator/health"]
        labels: { service: notification-service }
      - targets: ["http://ai-service:8086/health"]
        labels: { service: ai-service }
      - targets: ["http://frontend:80/healthz"]
        labels: { service: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
