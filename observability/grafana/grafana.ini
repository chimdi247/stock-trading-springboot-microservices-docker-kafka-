; Grafana server config — mounted at /etc/grafana/grafana.ini
; $__env{NAME} values are injected from the container environment (docker-compose.yml / .env)

[server]
root_url = http://localhost:3001/

[security]
disable_gravatar = true

[users]
default_theme = dark

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/trading-services-overview.json
min_refresh_interval = 5s

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
level = info

; ---------------- Alerting (Grafana-managed) ----------------
[unified_alerting]
enabled = true

[alerting]
enabled = false

; ---------------- SMTP — used by the e-mail contact point ----------------
; Default target is the bundled Mailpit sink (http://localhost:8025).
[smtp]
enabled = true
host = $__env{SMTP_HOST}:$__env{SMTP_PORT}
user = $__env{SMTP_USER}
password = $__env{SMTP_PASSWORD}
from_address = $__env{SMTP_FROM_ADDRESS}
from_name = $__env{SMTP_FROM_NAME}
skip_verify = $__env{SMTP_SKIP_VERIFY}
startTLS_policy = $__env{SMTP_STARTTLS_POLICY}
