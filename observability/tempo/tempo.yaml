stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

# TraceQL metrics queries (e.g. `{ } | rate()`) are served by the query-frontend.
# They need the `local-blocks` processor below. max_duration controls how far back
# a metrics query may look. If your Tempo version rejects this block, remove it:
# the field names changed between releases.
query_frontend:
  metrics:
    max_duration: 24h

# Derives RED metrics + the service graph from traces and remote-writes them to
# Prometheus (needs --web.enable-remote-write-receiver, set in docker-compose).
# The local-blocks processor stores recent traces in local blocks so that
# TraceQL metrics queries work.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      # false = keep all spans (needed for rate()/quantile queries across span kinds)
      filter_server_spans: false
      # write completed blocks to the main trace storage so they can be queried later
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
