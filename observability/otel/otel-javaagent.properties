# =====================================================================
# OpenTelemetry Java agent — shared configuration for all JVM services
# Mounted at /otel/otel-javaagent.properties and activated by
#   OTEL_JAVAAGENT_CONFIGURATION_FILE (see docker-compose.yml).
# Per-service values (OTEL_SERVICE_NAME, endpoint) come from env vars,
# which take precedence over this file.
# =====================================================================

# ── Signals: traces + metrics + logs, all over OTLP to the collector ──
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.timeout=10000

# Push metrics every 10s (Prometheus scrapes the collector every 15s)
otel.metric.export.interval=10000
otel.bsp.schedule.delay=2000

# ── Context propagation ──────────────────────────────────────────────
# W3C traceparent/tracestate + baggage. Carried automatically over:
#   gateway -> services (Netty / HTTP), services -> services (Feign),
#   order -> ai-service (HTTP, Python), and producer -> consumer (Kafka headers).
otel.propagators=tracecontext,baggage

# ── Sampling ─────────────────────────────────────────────────────────
# Keep everything in dev. For production use e.g. parentbased_traceidratio + arg 0.1
otel.traces.sampler=parentbased_always_on

# ── Logs ─────────────────────────────────────────────────────────────
# The logback appender instrumentation ships every log line as an OTLP log
# record carrying trace_id/span_id -> Loki -> "click a log, open the trace".
otel.instrumentation.logback-appender.experimental-log-attributes=true
otel.instrumentation.logback-appender.experimental.capture-code-attributes=true
# Puts trace_id / span_id into the logback MDC (used by logging.pattern.level)
otel.instrumentation.logback-mdc.enabled=true

# ── Instrumentation tuning ───────────────────────────────────────────
otel.instrumentation.kafka.experimental-span-attributes=true
otel.instrumentation.jdbc.statement-sanitizer.enabled=true

# JVM runtime metrics (memory, GC, threads, CPU, classes) are on by default.
# Spring scheduler spans stay on: one trace per market tick, covering Redis + Kafka.
