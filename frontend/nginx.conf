server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Together with the variable below, nginx re-resolves
  # "api-gateway" every 10s instead of once at startup, so recreating the gateway
  # container (new IP) no longer causes 502 Bad Gateway until the frontend restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://api-gateway:8080;

  # health endpoint for docker / blackbox probes
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # REST API -> API gateway (JWT is validated there)
  location /api/ {
    # A variable in proxy_pass without a URI part passes the original request URI
    # unchanged, exactly like the previous "proxy_pass http://api-gateway:8080;".
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # keep W3C trace context flowing if a client sends one
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    proxy_read_timeout 60s;
  }

  # SockJS / STOMP WebSocket -> gateway -> market-data-service
  location /ws {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # static assets: long cache; SPA fallback for client-side routes
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
